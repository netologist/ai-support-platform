version: "3"

vars:
  api_debug_port: 2345
  worker_debug_port: 2346
  coverage_file: tmp/coverage.out
  coverage_html: tmp/coverage.html
  junit_file: tmp/unit-tests.xml
  test_flags: -race
  test_packages: $(go list ./... | grep -v '/test\/e2e\|/internal\/mocks|/vendor')

tasks:
  bootstrap:
    desc: Install repo-managed Go tools and verify key editor tooling
    cmds:
      - go install tool
      - go tool goimports -h >/dev/null
      - go tool golangci-lint version
      - go tool dlv version
      - go tool task --list >/dev/null

  build:docker:
    desc: Build Docker images
    cmds:
      - docker build -t ai-support-platform-api --build-arg APP=api .

  local-up:
    desc: Start local infrastructure
    cmds:
      - docker-compose up -d

  local-down:
    desc: Stop local infrastructure
    cmds:
      - docker-compose down --remove-orphans {{.CLI_ARGS}}

  run:
    desc: Run app with hot reload
    cmds:
      - go tool air

  run:api:
    desc: Run API with hot reload
    cmds:
      - go tool air -c .air.api.toml

  run:worker:
    desc: Run Worker with hot reload
    cmds:
      - go tool air -c .air.worker.toml

  debug:api:
    desc: Start Delve for cmd/api on port {{.api_debug_port}}
    preconditions:
      - sh: test -d ./cmd/api
        msg: cmd/api does not exist yet
    cmds:
      - go tool dlv debug ./cmd/api --headless --listen=:{{.api_debug_port}}
        --api-version=2 --accept-multiclient

  debug:worker:
    desc: Start Delve for cmd/worker on port {{.worker_debug_port}}
    preconditions:
      - sh: test -d ./cmd/worker
        msg: cmd/worker does not exist yet
    cmds:
      - go tool dlv debug ./cmd/worker --headless
        --listen=:{{.worker_debug_port}} --api-version=2 --accept-multiclient

  lint:
    desc: Run linter
    cmds:
      - go tool golangci-lint run

  fmt:
    desc: Format code
    cmds:
      - go tool goimports -w .

  test:
    desc: Run tests with gotestsum
    cmds:
      - go tool gotestsum --format pkgname -- {{.test_flags}} {{.test_packages}}

  coverage:
    desc: Run tests with coverage output
    cmds:
      - mkdir -p tmp
      - go tool gotestsum --format pkgname --junitfile {{.junit_file}} --
        {{.test_flags}} -coverprofile={{.coverage_file}} {{.test_packages}}
      - go tool cover -func={{.coverage_file}}

  coverage:html:
    desc: Generate HTML coverage report
    cmds:
      - mkdir -p tmp
      - go test {{.test_flags}} -coverprofile={{.coverage_file}}
        {{.test_packages}}
      - go tool cover -html={{.coverage_file}} -o {{.coverage_html}}

  vuln:
    desc: Check vulnerabilities
    cmds:
      - go tool govulncheck ./...

  migrate:
    desc: Run goose commands; pass args after --
    cmds:
      - go tool goose {{.CLI_ARGS}}

  seed:
    desc: Run goose commands; pass args after --
    cmds:
      - go tool goose -dir ./migrations/seeds {{.CLI_ARGS}}

  mocks:
    desc: Run mockery; pass args after --
    cmds:
      - go tool mockery {{.CLI_ARGS}}

  generate:
    desc: Run code generators
    cmds:
      - go tool sqlc generate
      - go tool oapi-codegen -config openapi/config.yaml openapi/spec.yaml
      - go tool gqlgen generate

  e2e:up:
    desc: Build and start containerized E2E environment
    cmds:
      - docker-compose -f compose.e2e.yaml up -d --build

  e2e:down:
    desc: Stop E2E environment and remove volumes
    cmds:
      - docker-compose -f compose.e2e.yaml down --remove-orphans -v

  e2e:test:
    desc: Run black-box E2E suite inside compose.e2e stack
    cmds:
      - docker-compose -f compose.e2e.yaml up --build --force-recreate
        --exit-code-from e2e e2e
