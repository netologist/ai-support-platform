services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_support_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_support_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_e2e_data:/data

  kafka:
    image: docker.io/bitnamilegacy/kafka:3.9
    restart: unless-stopped
    ports:
      - "19094:9094"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    volumes:
      - kafka_e2e_data:/bitnami/kafka

  kafka-init:
    image: docker.io/bitnamilegacy/kafka:3.9
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic audit.logged.v1 --partitions 1 --replication-factor 1
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ticket.created.v1 --partitions 1 --replication-factor 1
    restart: "no"

  migrate:
    image: golang:1.26.2
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_support_platform?sslmode=disable
    volumes:
      - ./:/workspace
    command:
      - /bin/sh
      - -ec
      - |
        export GOOSE_DRIVER=postgres
        export GOOSE_DBSTRING="$$APP_DATABASE_URL"
        go tool goose -env=none -dir ./migrations up
        go tool goose -env=none -dir ./migrations/seeds up
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      APP_HTTP_ADDRESS: :8080
      APP_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_support_platform?sslmode=disable
      APP_REDIS_ADDRESS: redis:6379
      APP_REDIS_PASSWORD: ""
      APP_REDIS_DB: "0"
      APP_KAFKA_BROKERS: kafka:9092
      APP_KAFKA_AUDIT_TOPIC: audit.logged.v1
      APP_KAFKA_TICKET_TOPIC: ticket.created.v1
      APP_JWT_ISSUER: ai-support-platform
      APP_JWT_SECRET: change-me
      APP_JWT_TTL: 15m
      APP_TICKET_CACHE_TTL: 1m
      APP_RATE_LIMIT_WINDOW: 1m
      APP_PUBLIC_RATE_LIMIT: "200"
      APP_AUTHENTICATED_RATE_LIMIT: "1000"
      APP_AI_PROVIDER: fake

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_support_platform?sslmode=disable
      APP_REDIS_ADDRESS: redis:6379
      APP_REDIS_PASSWORD: ""
      APP_REDIS_DB: "0"
      APP_KAFKA_BROKERS: kafka:9092
      APP_KAFKA_AUDIT_TOPIC: audit.logged.v1
      APP_KAFKA_TICKET_TOPIC: ticket.created.v1
      APP_JWT_ISSUER: ai-support-platform
      APP_JWT_SECRET: change-me
      APP_JWT_TTL: 15m
      APP_TICKET_CACHE_TTL: 1m
      APP_RATE_LIMIT_WINDOW: 1m
      APP_PUBLIC_RATE_LIMIT: "200"
      APP_AUTHENTICATED_RATE_LIMIT: "1000"
      APP_AI_PROVIDER: fake

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started
    environment:
      E2E_BASE_URL: http://api:8080
    restart: "no"

volumes:
  postgres_e2e_data:
  redis_e2e_data:
  kafka_e2e_data:

